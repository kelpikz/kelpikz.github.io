<!-- The wall: a Mewar elephant with its rider, painted on lime plaster by src/mural/ (painter.js, elephant.js, haveli.js).
     #wall is painted once (and again after a resize); #shade holds the leaf shadows that move on it. -->
<canvas class="scene" id="wall" aria-hidden="true"></canvas>
<canvas class="scene" id="shade" aria-hidden="true"></canvas>

<!-- The scroll hangs on the empty wall in front of the elephant, and unrolls.  writing.js paints the paper, the staves,
     the cord and the tassels with the brush engine of the mural; the text is plain HTML on top.
     To add an article, copy the <li> in the list and put the new one first (newest at the top). -->


<main class="scroll" id="scroll">
  <canvas class="cord" id="cord" aria-hidden="true"></canvas>
  <canvas class="stave" id="stave" aria-hidden="true"></canvas>
  <div class="roll" id="roll">
    <div class="sheet" id="text">
      <canvas class="paper" id="paper" aria-hidden="true"></canvas>
      <h1><span>Writing</span></h1>
      <p class="lead">Notes on what I build and what I learn on the way.</p>

      <ol class="index">
        <li>
          <a class="name" href="https://files.ajitha.fyi/agents-on-incidents">Benchmarking agents on incidents</a>
          <time class="when" datetime="2026-11-24">November 2026</time>
          <p>I gave AI agents the same production incidents, then scored how well each one found the root cause.</p>
        </li>
      </ol>

      <div class="end" aria-hidden="true"></div>
    </div>
  </div>
  <div class="spool">
    <canvas id="spool" aria-hidden="true"></canvas>
    <span class="tassel l" aria-hidden="true"><canvas></canvas></span>
    <span class="tassel r" aria-hidden="true"><canvas></canvas></span>
  </div>
</main>

<script src="src/mural/painter.js"></script>
<script src="src/mural/elephant.js"></script>
<script src="src/mural/haveli.js"></script>
<script src="writing.js"></script>

      document.head.appendChild(counter);
