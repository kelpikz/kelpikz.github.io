<body data-mood="day">

<header class="top" id="top">
  <a class="home tab" href="index.html">Ajitha Prasad</a>
  <div class="tools tab" id="tools">
    <div class="moods" role="group" aria-label="Time of day in the picture">
      <button type="button" data-mood="day" aria-pressed="false">Day</button>
      <button type="button" data-mood="dusk" aria-pressed="false">Dusk</button>
      <button type="button" data-mood="night" aria-pressed="false">Night</button>
    </div>
    <button type="button" id="pause">Pause</button>
  </div>
</header>

<!-- The Experience page is one painting of a stepwell, 16:9, cut into a pyramid of tiles (assets/well8k/, with its
     manifest.js).  It opens on the whole well, and a camera
     flies down into it, one thing at a time: going down is going back in time.  The card on the right says what you are
     at; the water gauge on the left says which year.  The words are in experience-data.js, and experience.js lays them
     out. -->
<main id="main">
  <div class="well" id="well">
    <canvas class="paint" id="paint" role="img"></canvas>
    <canvas class="live" id="live" aria-hidden="true"></canvas>
    <div class="hot" id="hot"></div>
    <div class="veil" aria-hidden="true"></div>
  </div>

  <section class="hero" id="hero" aria-labelledby="exp-title">
    <div class="hero-words" id="heroWords">
      <div class="slip"><h1 id="exp-title">Experience</h1></div>
      <p class="note" id="intro">Go down the stepwell to see what I built, from Optmyzr back to my time at NIT Trichy.</p>
      <button type="button" class="cue" id="cue"><span id="cueText">Go down</span> <span class="arrow" aria-hidden="true"></span></button>
    </div>
  </section>

  <!-- the year gauge: a staff standing in water; experience.js builds it -->
  <nav class="gauge off" id="gauge" aria-label="Years, on the water gauge"></nav>

  <aside class="card" id="card" aria-label="Where you are in the well">
    <button type="button" class="grab" id="grab" aria-expanded="false" aria-controls="cardBody"><span class="grab-bar" aria-hidden="true"></span><span class="grab-text">More</span></button>
    <nav class="lamps" aria-label="Years"><ol id="lamps"></ol></nav>
    <div class="card-body" id="cardBody"></div>
    <div class="updown">
      <button type="button" id="up"><span class="arrow up" aria-hidden="true"></span><span class="ud-text">Up</span></button>
      <button type="button" id="down"><span class="ud-text">Down</span><span class="arrow" aria-hidden="true"></span></button>
    </div>
  </aside>

  <p class="tip" id="tip" aria-hidden="true"></p>

  <noscript>
    <div class="nojs">
      <img class="nojs-pic" src="assets/well8k/z1/0_0.webp" width="1920" height="1080" alt="The whole stepwell from its rim, in pastel in the manner of Mewar painting: a gold sun over a white chhatri at the head of one long stair, five galleries of arches going down from saffron through rose, red and green to night blue, lamps lit in the alcoves, and one lamp floating on the dark water at the bottom.">
      <p>I joined Optmyzr as a software engineer in June 2023. I built <strong>Sidekick, AI Rule Builder and the Portfolio Management Platform</strong>.</p>
      <p>I earned my B.Tech at NIT Trichy, led the web team for Pragyan and built campus platforms with Delta Force. Read more in my <a href="assets/Ajitha_Prasad_Resume_Website.pdf">r&eacute;sum&eacute;</a>.</p>
    </div>
  </noscript>
</main>

<p class="sr" id="say" aria-live="polite"></p>
